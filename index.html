  <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />

  <link href="https://fonts.bunny.net/css?family=jetbrains-mono:400,500|outfit:400,500,600,700" rel="stylesheet" />
  <style>
    /*
      Design Read: kinetic developer identity — cool, restrained, not neon-hacker.
      Dials: VARIANCE 6 · MOTION 7 · DENSITY 2
    */

    :root {
      --font-sans: "Outfit", ui-sans-serif, system-ui, sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, monospace;
      --surface: #fafafa;
      --surface-2: #f4f4f5;
      --ink: #09090b;
      --muted: #71717a;
      --faint: #a1a1aa;
      --line: #e4e4e7;
      --accent: #3b82f6;
      --spot: rgba(59, 130, 246, 0.08);
      --field-fade: rgba(250, 250, 250, 0.14);
      --field-ink: #a1a1aa;
      --radius: 999px;
      color-scheme: light;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --surface: #09090b;
        --surface-2: #121214;
        --ink: #fafafa;
        --muted: #a1a1aa;
        --faint: #52525b;
        --line: #27272a;
        --accent: #60a5fa;
        --spot: rgba(96, 165, 250, 0.07);
        --field-fade: rgba(9, 9, 11, 0.16);
        --field-ink: #3f3f46;
        color-scheme: dark;
      }
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      background: var(--surface);
      color: var(--ink);
    }

    body {
      min-height: 100dvh;
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      overflow-x: hidden;
      overflow-y: auto;
    }

    ::selection {
      background: color-mix(in oklab, var(--accent) 30%, transparent);
      color: var(--ink);
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .grain {
      pointer-events: none;
      position: fixed;
      inset: 0;
      z-index: 50;
      opacity: 0.04;
      mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    @media (prefers-color-scheme: dark) {
      .grain { opacity: 0.055; }
    }

    canvas#field {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    /* Cursor spotlight */
    .spot {
      pointer-events: none;
      position: fixed;
      inset: 0;
      z-index: 1;
      background: radial-gradient(
        520px circle at var(--mx, 50%) var(--my, 45%),
        var(--spot),
        transparent 55%
      );
      transition: opacity 0.4s ease;
    }

    .grid {
      pointer-events: none;
      position: fixed;
      inset: 0;
      z-index: 1;
      background-image:
        linear-gradient(var(--line) 1px, transparent 1px),
        linear-gradient(90deg, var(--line) 1px, transparent 1px);
      background-size: 72px 72px;
      mask-image: radial-gradient(ellipse 70% 60% at 50% 48%, black 10%, transparent 70%);
      -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 48%, black 10%, transparent 70%);
      opacity: 0.35;
    }

    .veil {
      pointer-events: none;
      position: fixed;
      inset: 0;
      z-index: 2;
      background:
        radial-gradient(ellipse 55% 42% at 50% 48%, var(--surface) 0%, transparent 70%),
        radial-gradient(ellipse 100% 70% at 50% 110%, var(--surface) 0%, transparent 50%);
    }

    /* Corner marks */
    .frame {
      pointer-events: none;
      position: fixed;
      inset: 1.25rem;
      z-index: 3;
      border: 1px solid color-mix(in oklab, var(--line) 70%, transparent);
      border-radius: 2px;
      opacity: 0.55;
    }

    .frame::before,
    .frame::after {
      content: "";
      position: absolute;
      width: 14px;
      height: 14px;
      border: 1.5px solid var(--muted);
    }

    .frame::before {
      top: -1px;
      left: -1px;
      border-right: 0;
      border-bottom: 0;
    }

    .frame::after {
      bottom: -1px;
      right: -1px;
      border-left: 0;
      border-top: 0;
    }

    .stage {
      position: relative;
      z-index: 10;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 2rem 1.5rem;
    }

    .identity {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.75rem;
      text-align: center;
      width: min(100%, 52rem);
    }

    .meta {
      font-family: var(--font-mono);
      font-size: 0.6875rem;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--faint);
    }

    .name {
      position: relative;
      font-family: var(--font-sans);
      font-size: clamp(3rem, 14vw, 7.5rem);
      font-weight: 600;
      letter-spacing: -0.055em;
      line-height: 0.95;
      color: var(--ink);
      cursor: default;
      user-select: none;
    }

    .name .char {
      display: inline-block;
      min-width: 0.42em;
      will-change: transform, opacity;
    }

    .name .char.is-scrambling {
      font-family: var(--font-mono);
      font-weight: 500;
      letter-spacing: -0.02em;
      color: var(--muted);
      transform: translateY(-0.04em);
    }

    .name .char.is-hot {
      color: var(--accent);
    }

    /* soft underline pulse under word */
    .name::after {
      content: "";
      display: block;
      width: 0;
      height: 2px;
      margin: 0.55em auto 0;
      border-radius: 2px;
      background: linear-gradient(90deg, transparent, var(--ink), transparent);
      opacity: 0.18;
    }

    @media (prefers-reduced-motion: no-preference) {
      .name::after {
        animation: rule 1.1s cubic-bezier(0.16, 1, 0.3, 1) 0.55s forwards;
      }
    }

    @keyframes rule {
      from { width: 0; }
      to { width: min(100%, 12rem); }
    }

    /*
      Description: editorial two-beat quote.
      Hierarchy via weight/color, emphasis via italic of SAME family (no serif mix).
    */
    .desc {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.65rem;
      margin: 0.15rem 0 0.35rem;
      padding: 0 0.5rem;
      max-width: 22rem;
      width: 100%;
    }

    .desc::before {
      content: "";
      width: 1.5rem;
      height: 1px;
      margin-bottom: 0.35rem;
      background: color-mix(in oklab, var(--ink) 22%, transparent);
    }

    .desc-a,
    .desc-b {
      display: block;
      width: 100%;
      text-wrap: balance;
    }

    .desc-a {
      font-family: var(--font-sans);
      font-size: clamp(0.9375rem, 2.1vw, 1.0625rem);
      font-weight: 400;
      line-height: 1.5;
      letter-spacing: -0.015em;
      color: var(--muted);
    }

    .desc-b {
      font-family: var(--font-sans);
      font-size: clamp(1.0625rem, 2.6vw, 1.25rem);
      font-weight: 500;
      line-height: 1.35;
      letter-spacing: -0.03em;
      color: var(--ink);
    }

    /* Same-family italic emphasis; reserve space for descenders (g, y) */
    .desc-b em {
      font-style: italic;
      font-weight: 500;
      color: var(--accent);
      padding-bottom: 0.08em;
    }

    @media (min-width: 640px) {
      .desc {
        max-width: 26rem;
        gap: 0.7rem;
      }
    }

    @media (prefers-reduced-motion: no-preference) {
      .desc::before,
      .desc-a,
      .desc-b {
        opacity: 0;
        transform: translateY(10px);
        animation: rise 0.75s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .desc::before { animation-delay: 0.5s; }
      .desc-a { animation-delay: 0.58s; }
      .desc-b { animation-delay: 0.72s; }
    }

    /* Experience: mono skill chips + soft caption (not a long bullet dump) */
    .exp {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.85rem;
      width: min(100%, 28rem);
      padding: 0 0.5rem;
    }

    .exp-lead {
      font-family: var(--font-mono);
      font-size: 0.6875rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--faint);
    }

    .exp-tags {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.45rem;
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .exp-tags li {
      padding: 0.35rem 0.7rem;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 400;
      letter-spacing: 0.01em;
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: 999px;
      background: color-mix(in oklab, var(--surface) 75%, var(--surface-2));
      transition:
        color 0.2s cubic-bezier(0.16, 1, 0.3, 1),
        border-color 0.2s cubic-bezier(0.16, 1, 0.3, 1),
        background 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .exp-tags li:hover {
      color: var(--ink);
      border-color: color-mix(in oklab, var(--line) 35%, var(--ink));
      background: var(--surface-2);
    }

    .exp-more {
      max-width: 26rem;
      font-family: var(--font-sans);
      font-size: clamp(0.875rem, 2vw, 0.9375rem);
      font-weight: 400;
      line-height: 1.55;
      letter-spacing: -0.01em;
      color: var(--muted);
      text-wrap: balance;
    }

    .exp-more strong {
      font-weight: 500;
      color: var(--ink);
    }

    @media (prefers-reduced-motion: no-preference) {
      .exp > * {
        opacity: 0;
        transform: translateY(10px);
        animation: rise 0.75s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .exp > *:nth-child(1) { animation-delay: 0.82s; }
      .exp > *:nth-child(2) { animation-delay: 0.92s; }
      .exp > *:nth-child(3) { animation-delay: 1.05s; }
    }

    .link {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      padding: 0.75rem 1.25rem;
      font-family: var(--font-mono);
      font-size: 0.8125rem;
      font-weight: 400;
      letter-spacing: 0.03em;
      color: var(--muted);
      text-decoration: none;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: color-mix(in oklab, var(--surface) 70%, var(--surface-2));
      box-shadow: 0 0 0 0 transparent;
      transition:
        color 0.2s cubic-bezier(0.16, 1, 0.3, 1),
        border-color 0.2s cubic-bezier(0.16, 1, 0.3, 1),
        background 0.2s cubic-bezier(0.16, 1, 0.3, 1),
        box-shadow 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: transform;
    }

    .link:hover {
      color: var(--ink);
      border-color: color-mix(in oklab, var(--line) 30%, var(--ink));
      background: var(--surface-2);
      box-shadow: 0 12px 40px -20px color-mix(in oklab, var(--ink) 35%, transparent);
    }

    .link:active {
      transform: scale(0.98) !important;
    }

    .link svg {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
      opacity: 0.9;
    }

    .link .arrow {
      display: inline-block;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .link:hover .arrow {
      transform: translate(2px, -2px);
    }

    @media (prefers-reduced-motion: no-preference) {
      .identity > *:not(.desc):not(.exp) {
        opacity: 0;
        transform: translateY(18px);
        animation: rise 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .identity > *:nth-child(1) { animation-delay: 0.04s; }
      .identity > *:nth-child(2) { animation-delay: 0.1s; }
      .identity > *:nth-child(5) { animation-delay: 1.15s; }
    }

    @keyframes rise {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .name .char.is-scrambling {
        font-family: var(--font-sans);
        color: var(--ink);
        transform: none;
      }
      .spot { display: none; }
    }
  </style>
</head>
<body>

  <main class="stage">
    <div class="identity">

  </main>

  <script>
    (function () {
      var WORD = "tonamson";
      var GLYPHS = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789@#$%&*";
      var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      var nameEl = document.getElementById("name");
      var spot = document.getElementById("spot");
      var gh = document.getElementById("gh");
      var root = document.documentElement;

      /* ---------- build letters ---------- */
      var chars = WORD.split("").map(function (c) {
        var span = document.createElement("span");
        span.className = "char";
        span.textContent = reduce ? c : GLYPHS[(Math.random() * GLYPHS.length) | 0];
        span.dataset.final = c;
        span.dataset.busy = "0";
        nameEl.appendChild(span);
        return span;
      });

      function glyph() {
        return GLYPHS[(Math.random() * GLYPHS.length) | 0];
      }

      function scramble(el, steps, interval, hot) {
        if (reduce || el.dataset.busy === "1") return;
        el.dataset.busy = "1";
        el.classList.add("is-scrambling");
        if (hot) el.classList.add("is-hot");
        var step = 0;
        (function tick() {
          if (step < steps) {
            el.textContent = glyph();
            step++;
            setTimeout(tick, interval + Math.random() * 18);
          } else {
            el.textContent = el.dataset.final;
            el.classList.remove("is-scrambling", "is-hot");
            el.dataset.busy = "0";
          }
        })();
      }

      /* load cascade */
      chars.forEach(function (el, i) {
        setTimeout(function () {
          scramble(el, 10 + ((Math.random() * 10) | 0), 28, false);
        }, 90 + i * 85);
      });

      /* full-word re-decode occasionally */
      if (!reduce) {
        setInterval(function () {
          chars.forEach(function (el, i) {
            setTimeout(function () {
              scramble(el, 5 + ((Math.random() * 5) | 0), 32, false);
            }, i * 55);
          });
        }, 9000);
      }

      /* proximity scramble on pointer move over name */
      if (!reduce) {
        nameEl.addEventListener("pointermove", function (e) {
          chars.forEach(function (el) {
            var r = el.getBoundingClientRect();
            var cx = r.left + r.width / 2;
            var cy = r.top + r.height / 2;
            var dx = e.clientX - cx;
            var dy = e.clientY - cy;
            var dist = Math.hypot(dx, dy);
            if (dist < 48 && Math.random() > 0.55) {
              scramble(el, 3 + ((Math.random() * 3) | 0), 28, true);
            }
          });
        });

        nameEl.addEventListener("pointerleave", function () {
          chars.forEach(function (el) {
            if (el.dataset.busy === "0") {
              el.textContent = el.dataset.final;
              el.classList.remove("is-scrambling", "is-hot");
            }
          });
        });
      }

      /* cursor spotlight + magnetic link */
      var mx = window.innerWidth / 2;
      var my = window.innerHeight / 2;
      var smx = mx;
      var smy = my;
      var lx = 0;
      var ly = 0;
      var tx = 0;
      var ty = 0;
      var raf = 0;

      function loop() {
        smx += (mx - smx) * 0.12;
        smy += (my - smy) * 0.12;
        root.style.setProperty("--mx", smx + "px");
        root.style.setProperty("--my", smy + "px");

        lx += (tx - lx) * 0.16;
        ly += (ty - ly) * 0.16;
        if (gh) {
          gh.style.transform = "translate(" + lx.toFixed(2) + "px," + ly.toFixed(2) + "px)";
        }

        raf = requestAnimationFrame(loop);
      }

      if (!reduce) {
        window.addEventListener("pointermove", function (e) {
          mx = e.clientX;
          my = e.clientY;
        });

        if (gh) {
          gh.addEventListener("pointermove", function (e) {
            var r = gh.getBoundingClientRect();
            tx = (e.clientX - (r.left + r.width / 2)) * 0.28;
            ty = (e.clientY - (r.top + r.height / 2)) * 0.28;
          });
          gh.addEventListener("pointerleave", function () {
            tx = 0;
            ty = 0;
          });
        }

        raf = requestAnimationFrame(loop);
      }

      /* ---------- sparse kinetic field ---------- */
      var canvas = document.getElementById("field");
      var ctx = canvas.getContext("2d");
      var drops = [];
      var fontSize = 13;
      var pool = "01ABCDEFGHJKLMNPQRSTUVWXYZ";

      function css(name) {
        return getComputedStyle(root).getPropertyValue(name).trim();
      }

      function resize() {
        var dpr = Math.min(window.devicePixelRatio || 1, 2);
        var w = window.innerWidth;
        var h = window.innerHeight;
        canvas.width = Math.floor(w * dpr);
        canvas.height = Math.floor(h * dpr);
        canvas.style.width = w + "px";
        canvas.style.height = h + "px";
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        var n = Math.ceil(w / fontSize);
        drops = [];
        for (var i = 0; i < n; i++) {
          if (Math.random() > 0.72) {
            drops[i] = {
              y: Math.random() * -(h / fontSize),
              speed: 0.45 + Math.random() * 0.55
            };
          } else {
            drops[i] = null;
          }
        }
      }

      function drawField() {
        var w = window.innerWidth;
        var h = window.innerHeight;
        ctx.fillStyle = css("--field-fade");
        ctx.fillRect(0, 0, w, h);
        ctx.font = "500 " + fontSize + "px JetBrains Mono, monospace";
        var ink = css("--field-ink");

        for (var i = 0; i < drops.length; i++) {
          var d = drops[i];
          if (!d) continue;
          var ch = pool[(Math.random() * pool.length) | 0];
          var x = i * fontSize;
          var y = d.y * fontSize;

          // head brighter
          ctx.globalAlpha = 0.45;
          ctx.fillStyle = css("--muted");
          ctx.fillText(ch, x, y);
          ctx.globalAlpha = 0.18;
          ctx.fillStyle = ink;
          ctx.fillText(ch, x, y - fontSize);
          ctx.globalAlpha = 1;

          d.y += d.speed;
          if (y > h + 40) {
            if (Math.random() > 0.65) {
              d.y = 0;
              d.speed = 0.45 + Math.random() * 0.55;
            } else {
              drops[i] = null;
              // maybe wake another column
              var j = (Math.random() * drops.length) | 0;
              if (!drops[j] && Math.random() > 0.5) {
                drops[j] = { y: 0, speed: 0.45 + Math.random() * 0.55 };
              }
            }
          }
        }
      }

      resize();
      window.addEventListener("resize", resize);
      ctx.fillStyle = css("--surface");
      ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

      if (!reduce) {
        setInterval(drawField, 45);
      }

      window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function () {
        ctx.fillStyle = css("--surface");
        ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);
      });
    })();
  </script>
</body>
</html>
